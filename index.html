<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mappa della galassia</title>
  <link rel="stylesheet" href="css/stile.css">
</head>
<body>

  <header class="barra">
    <div class="riga-alta">
      <h1 id="titolo">Mappa concettuale</h1>
      <div class="ricerca">
        <input id="cerca" type="search" placeholder="Cerca nella mappa..."
               autocomplete="off" aria-label="Cerca nella mappa">
        <span id="esito" class="esito"></span>
      </div>
    </div>
    <p class="aiuto">
      Trascina lo sfondo per spostarti, usa la rotella (o due dita) per ingrandire.
      Clic su un nodo per metterlo al centro, doppio clic per aprirne la scheda.
      I contenuti si cambiano nei file <code>mappa.txt</code> e <code>schede.txt</code>.
    </p>
  </header>

  <!-- Qui compaiono gli avvisi sulle righe indentate male -->
  <div id="avvisi" class="avvisi" hidden></div>

  <canvas id="tela"></canvas>

  <!-- Scheda di approfondimento: si apre con un doppio clic su un nodo -->
  <aside id="scheda" class="scheda" hidden aria-live="polite">
    <button id="chiudi-scheda" class="chiudi" aria-label="Chiudi la scheda">&times;</button>
    <h2 id="scheda-titolo"></h2>
    <p id="scheda-testo"></p>
  </aside>

  <script src="js/mappa.js"></script>
</body>
</html>
